[project]
name = "football-pred"
version = "0.1.0"
description = "Paper-only football research system built on free data"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "rq>=2.1",
  "apscheduler>=3.11",
  "httpx>=0.28",
  "selectolax>=0.3.27",
  "feedparser>=6.0.11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "respx>=0.22",
  "ruff>=0.8",
  "playwright>=1.49",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
